name: CI

# Continuous integration checks for every pull request and develop push.
# Pushes to `main` are covered by verify.yml (fast, single runner): the release
# workflow only fires when public/version.txt changes, so main commits would
# otherwise reach no gate at all. Release bundling stays in build-release.yml.
on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR updates / develop pushes cancel their in-flight run instead of
# queueing another full 3-platform build.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  checks:
    # A hung apt step used to be able to burn the full 6-hour runner limit.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            cdp_target: 'x86_64-pc-windows-msvc'
          - platform: 'macos-14' # Apple Silicon
            cdp_target: 'aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            cdp_target: 'x86_64-unknown-linux-gnu'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: ${{ matrix.platform == 'macos-14' && 'aarch64-apple-darwin' || '' }}

      # Tauri 2 build dependencies for Debian/Ubuntu (WebKitGTK 4.1 baseline).
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            desktop-file-utils \
            xdg-utils \
            xvfb \
            xdotool \
            x11-utils \
            weston \
            dbus-x11 \
            libfuse2

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Patch package.json / src-tauri/Cargo.toml / tauri.conf.json from
      # public/version.txt before any Rust step, so CI compiles and audits the
      # version it would actually ship.
      - name: Sync version from public/version.txt
        run: pnpm run sync-version

      - name: Validate i18n
        run: pnpm run i18n:check

      - name: Run frontend tests
        run: pnpm test

      - name: Validate runtime identity policy and audit tools
        run: |
          pnpm run check:runtime-identity
          pnpm run test:identity-audit
          pnpm run test:packaged-identity

      # `tauri::generate_context!` resolves `frontendDist` (../dist) at compile
      # time, so the bundle has to exist before any cargo step touches src-tauri.
      - name: Build frontend
        run: pnpm run build

      # Signed-out readers cannot open Actions logs, so every Rust step tees its
      # output to a file the diagnostics step publishes publicly. `shell: bash`
      # keeps the Windows runner on the same pipeline semantics as Linux.
      - name: Rust format
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target
          {
            cargo fmt --package discord-cdp-launch-core --package discord-cdp-launcher -- --check
            cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          } 2>&1 | tee target/rust-fmt.log

      # Also the first Cargo compilation of the pipeline. `unused` (imports,
      # variables, dead code, discarded must_use results) and the clippy
      # correctness/suspicious groups are hard gates. The style group has a large
      # backlog in this crate — roughly 190 `|value| value.method()` closures
      # alone — so it stays warning-level until that is cleared, then this can
      # tighten back to `-D warnings`.
      - name: Rust clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --all-features --message-format=short \
            -- -D unused -D clippy::correctness -D clippy::suspicious 2>&1 |
            tee target/rust-clippy.log

      # Single-threaded on purpose: several tests mutate process env or rely on a
      # released loopback port staying free, which only holds when no other test
      # runs beside them. A flake here costs a full CI round trip.
      - name: Rust tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast -- --test-threads=1 2>&1 |
            tee target/rust-tests.log

      # Job logs and job summaries both need a GitHub login, but annotations are
      # public: the failing lines are echoed as `::error::` chunks, retrievable
      # with `curl .../check-runs/<job id>/annotations`.
      - name: Publish Rust diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          for f in target/rust-fmt.log target/rust-clippy.log target/rust-tests.log; do
            [ -f "$f" ] || continue
            if [ "$f" = "target/rust-fmt.log" ]; then
              pat='^Diff in|^[-+]'
            else
              # `cargo test` puts the useful part on the lines *after* the panic,
              # so the assertion and its left/right values are matched too.
              pat=': error|^error|error\[E|FAILED|panicked at|assertion'
              pat="$pat|^ +(left|right):|^test result:|^---- "
            fi
            name="$(basename "$f")"
            {
              echo "### $name"
              echo '```text'
              grep -E "$pat" "$f" | head -n 200
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            for start in 1 121 241; do
              chunk="$(grep -E "$pat" "$f" | sed -n "${start},$((start + 120))p" |
                sed -e 's/%/%25/g' -e 's/$/%0A/' | tr -d '\n')"
              if [ -n "$chunk" ]; then
                echo "::error::$name from line ${start}:$chunk"
              fi
            done
          done

      - name: Verify CDP core dependency boundary
        run: pnpm run check:cdp-core-deps

      - name: Build runner sidecar
        env:
          TAURI_TARGET_TRIPLE: ${{ matrix.cdp_target }}
        run: pnpm run build:runner

      - name: Build Discord CDP launcher sidecar
        env:
          TAURI_TARGET_TRIPLE: ${{ matrix.cdp_target }}
        run: pnpm run build:cdp-launcher

      - name: Build Linux DEB and AppImage identity smoke artifacts
        if: matrix.platform == 'ubuntu-22.04'
        run: pnpm exec tauri build --bundles deb,appimage

      - name: Audit and smoke-test Linux desktop identities
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          # Everything in scripts/ is committed as mode 100644, so calling
          # "scripts/x.sh" directly dies with exit 126; bash reads them anyway.
          deb_dir=target/release/bundle/deb
          appimage_dir=target/release/bundle/appimage
          for dir in "$deb_dir" "$appimage_dir"; do
            if [ ! -d "$dir" ]; then
              echo "::error::Missing $dir"
              find target/release/bundle -maxdepth 1 2>/dev/null || true
              exit 1
            fi
          done
          deb="$(find "$deb_dir" -maxdepth 1 -name '*.deb' -type f | head -n 1 || true)"
          appimage="$(find "$appimage_dir" -maxdepth 1 -name '*.AppImage' -type f | head -n 1 || true)"
          if [ -z "$deb" ] || [ -z "$appimage" ]; then
            echo "::error::Missing .deb or .AppImage (deb='$deb' appimage='$appimage')"
            exit 1
          fi
          node scripts/audit-packaged-identity.mjs \
            --platform linux --artifact "$deb" \
            --output target/release/bundle/identity-manifest-linux-deb.json
          node scripts/audit-packaged-identity.mjs \
            --platform linux --artifact "$appimage" \
            --output target/release/bundle/identity-manifest-linux-appimage.json
          mkdir -p "$RUNNER_TEMP/deb-root"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/deb-root"
          main_binary="$(node -p 'JSON.parse(require("fs").readFileSync("scripts/runtime-identity-tokens.json", "utf8")).identity.mainBinary')"
          binary="$RUNNER_TEMP/deb-root/usr/bin/$main_binary"
          # The GUI smoke launches the packaged app under Xvfb/Weston, which is
          # the least reliable check in CI: report it, never block the branch.
          smoke() {
            label="$1"
            shift
            log="$RUNNER_TEMP/$label.log"
            timeout 300 "$@" >"$log" 2>&1 && rc=0 || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "::notice::$label passed"
              return 0
            fi
            echo "::warning::$label failed with exit $rc"
            chunk="$(tail -n 25 "$log" | sed -e 's/%/%25/g' -e 's/$/%0A/' | tr -d '\n')"
            echo "::warning::$label:$chunk"
          }
          smoke linux-deb-x11 dbus-run-session -- xvfb-run -a bash \
            scripts/smoke-linux-runtime-identity.sh \
            x11 --kind binary "$binary" \
            target/release/bundle/identity-smoke-linux-deb-x11.json
          smoke linux-deb-wayland dbus-run-session -- bash \
            scripts/smoke-linux-runtime-identity.sh \
            wayland --kind binary "$binary" \
            target/release/bundle/identity-smoke-linux-deb-wayland.json
          smoke linux-appimage-x11 dbus-run-session -- xvfb-run -a bash \
            scripts/smoke-linux-runtime-identity.sh \
            x11 --kind appimage "$appimage" \
            target/release/bundle/identity-smoke-linux-appimage-x11.json
          smoke linux-appimage-wayland dbus-run-session -- bash \
            scripts/smoke-linux-runtime-identity.sh \
            wayland --kind appimage "$appimage" \
            target/release/bundle/identity-smoke-linux-appimage-wayland.json

      - name: Build unsigned macOS app and DMG identity smoke artifacts
        if: matrix.platform == 'macos-14'
        run: pnpm exec tauri build --no-sign --target ${{ matrix.cdp_target }} --bundles app,dmg

      - name: Audit and smoke-test unsigned macOS bundle
        if: matrix.platform == 'macos-14'
        shell: bash
        run: |
          # Search all of target/: a hardcoded target/<triple>/ guess costs a
          # whole run when cargo's layout differs, and scripts/ is mode 100644
          # so the checks below must go through bash.
          app="$(find target -maxdepth 8 -type d -name '*.app' 2>/dev/null | head -n 1 || true)"
          if [ -z "$app" ]; then
            echo "::error::No .app bundle anywhere under target/"
            find target -maxdepth 6 -type d -name bundle 2>/dev/null || true
            exit 1
          fi
          echo "Verified bundle: $app"
          manifest_dir=target/${{ matrix.cdp_target }}/release/bundle
          mkdir -p "$manifest_dir"
          bash scripts/verify-macos-bundle.sh "$app"
          node scripts/audit-packaged-identity.mjs \
            --platform macos --artifact "$app" \
            --output "$manifest_dir/identity-manifest-macos-smoke.json"
          smoke() {
            label="$1"
            shift
            log="$RUNNER_TEMP/$label.log"
            timeout 300 "$@" >"$log" 2>&1 && rc=0 || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "::notice::$label passed"
              return 0
            fi
            echo "::warning::$label failed with exit $rc"
            chunk="$(tail -n 25 "$log" | sed -e 's/%/%25/g' -e 's/$/%0A/' | tr -d '\n')"
            echo "::warning::$label:$chunk"
          }
          smoke macos-bundle bash scripts/smoke-macos-runtime-identity.sh "$app" \
            target/${{ matrix.cdp_target }}/release/bundle/identity-smoke-macos.json
          renamed_root="$(mktemp -d "$RUNNER_TEMP/runtime-identity-renamed.XXXXXX")"
          renamed_app="$renamed_root/DQH.app"
          cp -R "$app" "$renamed_app"
          smoke macos-renamed bash scripts/smoke-macos-runtime-identity.sh "$renamed_app" \
            target/${{ matrix.cdp_target }}/release/bundle/identity-smoke-macos-renamed.json

      - name: Upload desktop identity manifests
        if: matrix.platform == 'ubuntu-22.04' || matrix.platform == 'macos-14'
        uses: actions/upload-artifact@v7
        with:
          name: runtime-identity-${{ matrix.cdp_target }}
          path: |
            target/**/bundle/identity-*.json
