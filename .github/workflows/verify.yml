name: Verify

# Fast gate for `main`. The release workflow only triggers when
# public/version.txt changes and CI's full matrix runs on develop and pull
# requests, so a fix pushed straight to main used to reach no gate at all — a
# formatting diff was first visible three platform builds later.
#
# One Linux runner, no bundling, no macOS minutes: it fails in minutes with the
# exact rustfmt/clippy output.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A newer push to main supersedes the previous verification.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  quality:
    name: Format, lint and tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      # src-tauri links against WebKitGTK, so clippy and cargo test need the same
      # Tauri 2 build dependencies the release build installs.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            desktop-file-utils \
            xdg-utils

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Patch package.json / src-tauri/Cargo.toml / tauri.conf.json from
      # public/version.txt before any Rust step, so the checks see the version
      # the branch would actually ship.
      - name: Sync version from public/version.txt
        run: pnpm run sync-version

      - name: Validate i18n
        run: pnpm run i18n:check

      - name: Run frontend tests
        run: pnpm test

      - name: Validate runtime identity policy and audit tools
        run: |
          pnpm run check:runtime-identity
          pnpm run test:identity-audit
          pnpm run test:packaged-identity

      # `tauri::generate_context!` resolves `frontendDist` (../dist) at compile
      # time, so the bundle must exist before any cargo step touches src-tauri.
      - name: Build frontend
        run: pnpm run build

      # Signed-out readers cannot open Actions logs, so every Rust step tees its
      # output to a file the diagnostics step below publishes publicly.
      - name: Rust format
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target
          {
            cargo fmt --package discord-cdp-launch-core --package discord-cdp-launcher -- --check
            cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          } 2>&1 | tee target/rust-fmt.log

      # Also the first Cargo compilation of the pipeline. `unused` (imports,
      # variables, dead code, discarded must_use results) and the clippy
      # correctness/suspicious groups are hard gates. The style group has a large
      # backlog in this crate — roughly 190 `|value| value.method()` closures
      # alone — so it stays warning-level until that is cleared, then this can
      # tighten back to `-D warnings`.
      - name: Rust clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --all-features --message-format=short \
            -- -D unused -D clippy::correctness -D clippy::suspicious 2>&1 |
            tee target/rust-clippy.log

      - name: Rust tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee target/rust-tests.log

      # Job logs and job summaries both need a GitHub login, but annotations are
      # public: the failing lines are echoed as `::error::` chunks, retrievable
      # with `curl .../check-runs/<job id>/annotations`.
      - name: Publish Rust diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          for f in target/rust-fmt.log target/rust-clippy.log target/rust-tests.log; do
            [ -f "$f" ] || continue
            if [ "$f" = "target/rust-fmt.log" ]; then
              pat='^Diff in|^[-+]'
            else
              pat='error|FAILED|panicked at'
            fi
            name="$(basename "$f")"
            {
              echo "### $name"
              echo '```text'
              grep -E "$pat" "$f" | head -n 200
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            for start in 1 121 241; do
              chunk="$(grep -E "$pat" "$f" | sed -n "${start},$((start + 120))p" |
                sed -e 's/%/%25/g' -e 's/$/%0A/' | tr -d '\n')"
              if [ -n "$chunk" ]; then
                echo "::error::$name from line ${start}:$chunk"
              fi
            done
          done

      - name: Verify CDP core dependency boundary
        run: pnpm run check:cdp-core-deps
