name: 'publish'

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - 'public/version.txt'

permissions:
  contents: write
  packages: write

# Two releases racing on the same branch would overwrite each other's GitHub
# Release, so in-flight publishes queue instead of being cancelled.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  # The release is opened as a draft here, before any build runner boots: the
  # platform jobs upload their finished `.zip` and `.exe` straight onto it, so
  # nothing has to be parked in workflow artifacts and re-downloaded by a second
  # job. That removes the copies from the run's Artifacts panel and shaves a
  # whole runner (checkout + unzip + repack) off the publish.
  release_policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      should_release: ${{ steps.policy.outputs.should_release }}
      version: ${{ steps.policy.outputs.version }}
      prerelease: ${{ steps.policy.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6

      - name: Check release channel
        id: policy
        shell: bash
        run: |
          version=$(tr -d '\r\n' < public/version.txt)
          ref="${GITHUB_REF}"
          should_release=false
          prerelease=false

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "::error::Invalid release version: $version"
            exit 1
          fi

          if [[ "$ref" == "refs/heads/main" ]]; then
            should_release=true
            [[ "$version" =~ -rc[0-9]+$ ]] && prerelease=true
          elif [[ "$ref" == "refs/heads/develop" && "$version" =~ -rc[0-9]+$ ]]; then
            # Develop may publish release candidates only. A stable version on
            # develop must never create or update a formal release.
            should_release=true
            prerelease=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Release policy: ref=$ref version=$version should_release=$should_release prerelease=$prerelease"

      - name: Open the draft release
        if: steps.policy.outputs.should_release == 'true'
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.policy.outputs.version }}
          PRERELEASE: ${{ steps.policy.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=(--draft --title "$VERSION" --notes-file public/version-desc.txt)
          if [ "$PRERELEASE" = 'true' ]; then
            flags+=(--prerelease)
          fi

          if is_draft=$(gh release view "$VERSION" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$is_draft" = 'false' ]; then
              echo "::error::Release $VERSION is already published. Bump public/version.txt before publishing again."
              exit 1
            fi
            # Re-running a failed publish reuses the draft this workflow left
            # behind instead of stranding two releases on one version.
            gh release edit "$VERSION" "${flags[@]}"
          elif gh api "repos/$GH_REPO/git/refs/tags/$VERSION" >/dev/null 2>&1; then
            # A tag with no release is the normal state after a release was
            # deleted, and gh refuses to attach to an existing tag unless the
            # tag is verified rather than created.
            gh release create "$VERSION" --verify-tag "${flags[@]}"
          else
            gh release create "$VERSION" --target "$GITHUB_SHA" "${flags[@]}"
          fi

  # Every release-blocking check runs once here instead of three times in the
  # platform matrix: a single `cargo fmt --check` diff used to cost 3 x (node +
  # rust + pnpm install + vite build) before any artifact was produced.
  # Deliberately not gated on should_release, so dispatching this workflow is a
  # way to validate a branch without bumping public/version.txt.
  quality:
    needs: release_policy
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      # Tauri 2 build dependencies for Debian/Ubuntu (WebKitGTK 4.1 baseline).
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            desktop-file-utils \
            xdg-utils

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Patch package.json / src-tauri/Cargo.toml / tauri.conf.json from
      # public/version.txt before the Rust checks, so clippy, the tests and the
      # bundle all see the version this release actually ships with.
      - name: Sync version from public/version.txt
        run: pnpm run sync-version

      - name: Validate i18n
        run: pnpm run i18n:check

      - name: Run frontend tests
        run: pnpm test

      - name: Validate runtime identity policy and audit tools
        run: |
          pnpm run check:runtime-identity
          pnpm run test:identity-audit
          pnpm run test:packaged-identity

      # `tauri::generate_context!` resolves `frontendDist` (../dist) at compile
      # time, so the bundle has to exist before any cargo step touches src-tauri.
      - name: Build frontend
        run: pnpm run build

      # Signed-out readers cannot open Actions logs, so every Rust step tees its
      # output to a file the diagnostics step below publishes publicly.
      - name: Rust format
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target
          {
            cargo fmt --package discord-cdp-launch-core --package discord-cdp-launcher -- --check
            cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          } 2>&1 | tee target/rust-fmt.log

      # Also the first Cargo compilation of the pipeline. `unused` (imports,
      # variables, dead code, discarded must_use results) and the clippy
      # correctness/suspicious groups are hard gates. The style group has a large
      # backlog in this crate — roughly 190 `|value| value.method()` closures
      # alone — so it stays warning-level until that is cleared, then this can
      # tighten back to `-D warnings`.
      - name: Rust clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked --workspace --all-targets --all-features --message-format=short \
            -- -D unused -D clippy::correctness -D clippy::suspicious 2>&1 |
            tee target/rust-clippy.log

      # Single-threaded on purpose: several tests mutate process env or rely on a
      # released loopback port staying free, which only holds when no other test
      # runs beside them. A flake here costs a full release round trip.
      - name: Rust tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --workspace --no-fail-fast -- --test-threads=1 2>&1 |
            tee target/rust-tests.log

      # Job logs and job summaries both need a GitHub login, but annotations are
      # public: the failing lines are echoed as `::error::` chunks, retrievable
      # with `curl .../check-runs/<job id>/annotations`.
      - name: Publish Rust diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          for f in target/rust-fmt.log target/rust-clippy.log target/rust-tests.log; do
            [ -f "$f" ] || continue
            if [ "$f" = "target/rust-fmt.log" ]; then
              pat='^Diff in|^[-+]'
            else
              # `cargo test` puts the useful part on the lines *after* the panic,
              # so the assertion and its left/right values are matched too.
              pat=': error|^error|error\[E|FAILED|panicked at|assertion'
              pat="$pat|^ +(left|right):|^test result:|^---- "
            fi
            name="$(basename "$f")"
            {
              echo "### $name"
              echo '```text'
              grep -E "$pat" "$f" | head -n 200
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            for start in 1 121 241; do
              chunk="$(grep -E "$pat" "$f" | sed -n "${start},$((start + 120))p" |
                sed -e 's/%/%25/g' -e 's/$/%0A/' | tr -d '\n')"
              if [ -n "$chunk" ]; then
                echo "::error::$name from line ${start}:$chunk"
              fi
            done
          done

      - name: Verify CDP core dependency boundary
        run: pnpm run check:cdp-core-deps

  # Runs beside `quality`, not after it: the bundles only need the version and
  # the lockfile, so waiting ~2.5 minutes for a `cargo fmt` diff to finish before
  # starting three 6-10 minute compile jobs bought nothing. `release` below is
  # the gate that refuses to publish unless both succeed.
  build-tauri:
    needs:
      - release_policy
    if: needs.release_policy.outputs.should_release == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            # The release ships the NSIS .exe and the portable .zip only, so the
            # bundle step stops before also building the WiX .msi.
            args: '--bundles nsis'
            x-target: 'win32-x64'
            cdp_target: 'x86_64-pc-windows-msvc'
            runner-ext: '.exe'
          # TEMP Windows-only publishing: the two entries below are switched off
          # so a release runs on one runner. macOS bundling is the slowest job and
          # the Linux one adds four headless GUI smoke tests. Their upload steps are
          # already in this job behind `if: matrix.platform` guards, so re-enabling
          # a platform only means uncommenting the entry here and adding its asset
          # names to the check in the `release` job.
          # Nothing else needs restoring — the crates, sidecars, and platform code
          # are unchanged, and `quality` still builds and tests the Linux tree.
          # - platform: 'macos-14'  # Apple Silicon M1/M2 runner
          #   args: '--no-sign --target aarch64-apple-darwin'
          #   x-target: 'darwin-arm64'
          #   cdp_target: 'aarch64-apple-darwin'
          #   runner-ext: ''
          # - platform: 'ubuntu-22.04'  # AppImage baseline (WebKitGTK 4.1)
          #   args: '--bundles deb,appimage'
          #   x-target: 'linux-x64'
          #   cdp_target: 'x86_64-unknown-linux-gnu'
          #   runner-ext: ''

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false
      
      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-14' && 'aarch64-apple-darwin' || '' }}

      # Tauri 2 build dependencies for Debian/Ubuntu (WebKitGTK 4.1 baseline).
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav \
            build-essential \
            pkg-config \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libnss3 \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            binutils \
            squashfs-tools \
            python3 \
            xdg-utils \
            desktop-file-utils \
            xvfb \
            xdotool \
            x11-utils \
            weston \
            dbus-x11 \
            libfuse2

      # `swatinem/rust-cache` below already restores and saves `~/.cargo`
      # (registry, downloads and git dependencies) next to the target dir, so the
      # hand-rolled registry/index caches only added a second ~40s restore and a
      # ~16s save to every release.
      - name: Get version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release_policy.outputs.version }}
        run: |
          printf 'version=%s\n' "$RELEASE_VERSION" >> "$GITHUB_ENV"
      


      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      # Every release the bundler re-downloads NSIS (Windows) or the AppImage
      # tools (Linux) into its own tools dir, and a dropped connection there
      # throws away a compile that already finished. `rust-cache` above only
      # covers `~/.cargo` and the target dir, never this one. The unused path on
      # each platform is ignored by actions/cache.
      - name: Cache Tauri bundler tools
        uses: actions/cache@v5
        with:
          path: |
            ~/AppData/Local/tauri
            ~/.cache/tauri
          key: ${{ runner.os }}-tauri-tools-v1
    
      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Patch package.json / src-tauri/Cargo.toml / tauri.conf.json from
      # public/version.txt so the bundle ships the version this release names.
      # fmt, clippy, cargo test, i18n, vitest and the identity audits run once in
      # the `quality` job above; ci.yml still covers them per platform on push.
      - name: Sync version from public/version.txt
        run: pnpm run sync-version

      # `tauri::generate_context!` resolves `frontendDist` (../dist) at
      # compile time, so the bundle must exist before Cargo touches src-tauri.
      - name: Build frontend
        run: pnpm run build

      # The sidecar and bundle steps below consume the already-synced manifests.
      - name: Build runner sidecar
        env:
          TAURI_TARGET_TRIPLE: ${{ matrix.cdp_target }}
        run: pnpm run build:runner

      - name: Build Discord CDP launcher sidecar
        env:
          TAURI_TARGET_TRIPLE: ${{ matrix.cdp_target }}
        run: pnpm run build:cdp-launcher

      # The Tauri CLI directly instead of tauri-apps/tauri-action: that action's
      # release plumbing (release lookup or creation, updater `latest.json`, asset
      # globbing and uploading) is duplicated by the steps below, and every run
      # paid for the API round trips. The finished bundles now go onto the draft
      # release opened by `release_policy`.
      #
      # `beforeBuildCommand` is blanked because the "Build frontend" step above
      # already produced `dist/` (and `tauri::generate_context!` needs it at
      # compile time); left alone, `tauri build` would run vue-tsc and vite a
      # second time inside the bundle step. The blank is a file, not an inline
      # JSON string: on Windows the step runs through the `pnpm.cmd` shim, cmd.exe
      # eats the embedded double quotes, the CLI gets `{build:{...}}` and the job
      # dies in one second on a parse error. A relative `--config` path resolves
      # against the working directory and merges into tauri.conf.json.
      #
      # No `-- --locked` here: `quality` already gates the lockfile with
      # `cargo clippy --locked` and `cargo test --locked`, and `tauri build` does
      # not document forwarding cargo flags through `pnpm run tauri`.
      - name: Write the bundle config override
        shell: bash
        run: |
          mkdir -p build
          printf '{"build":{"beforeBuildCommand":""}}\n' > build/tauri-bundle-override.json

      - name: Build the app bundle
        run: pnpm tauri build ${{ matrix.args }} --config build/tauri-bundle-override.json

      - name: Verify unsigned macOS bundle identity and integrity
        if: matrix.platform == 'macos-14'
        shell: bash
        run: |
          # Everything in scripts/ is committed as mode 100644, so calling
          # "scripts/x.sh" directly dies with exit 126; bash reads them anyway.
          # Search all of target/: the bundle lands under target/<triple>/ only
          # while cargo honours --target, and a wrong guess costs a full run.
          app="$(find target -maxdepth 8 -type d -name '*.app' 2>/dev/null | head -n 1 || true)"
          if [ -z "$app" ]; then
            echo "::error::No .app bundle anywhere under target/"
            find target -maxdepth 6 -type d -name bundle 2>/dev/null || true
            exit 1
          fi
          echo "Verified bundle: $app"
          bundle_dir="$(cd "$(dirname "$app")/.." && pwd -P)"
          bash scripts/verify-macos-bundle.sh "$app"
          node scripts/audit-packaged-identity.mjs \
            --platform macos \
            --artifact "$app" \
            --output "$bundle_dir/identity-manifest.json"

      - name: Audit Linux release packages
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          deb_dir=target/release/bundle/deb
          appimage_dir=target/release/bundle/appimage
          for dir in "$deb_dir" "$appimage_dir"; do
            if [ ! -d "$dir" ]; then
              echo "::error::Missing $dir"
              find target/release/bundle -maxdepth 1 2>/dev/null || true
              exit 1
            fi
          done
          deb="$(find "$deb_dir" -maxdepth 1 -name '*.deb' -type f | head -n 1 || true)"
          appimage="$(find "$appimage_dir" -maxdepth 1 -name '*.AppImage' -type f | head -n 1 || true)"
          if [ -z "$deb" ] || [ -z "$appimage" ]; then
            echo "::error::Missing .deb or .AppImage (deb='$deb' appimage='$appimage')"
            exit 1
          fi
          node scripts/audit-packaged-identity.mjs \
            --platform linux --artifact "$deb" \
            --output target/release/bundle/identity-manifest-linux-deb.json
          node scripts/audit-packaged-identity.mjs \
            --platform linux --artifact "$appimage" \
            --output target/release/bundle/identity-manifest-linux-appimage.json
          mkdir -p "$RUNNER_TEMP/deb-root"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/deb-root"
          main_binary="$(node -p 'JSON.parse(require("fs").readFileSync("scripts/runtime-identity-tokens.json", "utf8")).identity.mainBinary')"
          binary="$RUNNER_TEMP/deb-root/usr/bin/$main_binary"
          # The GUI smoke launches the packaged app under Xvfb/Weston, which is
          # the least reliable check in CI: report it, never block a release.
          smoke() {
            label="$1"
            shift
            log="$RUNNER_TEMP/$label.log"
            timeout 300 "$@" >"$log" 2>&1 && rc=0 || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "::notice::$label passed"
              return 0
            fi
            echo "::warning::$label failed with exit $rc"
            chunk="$(tail -n 25 "$log" | sed -e 's/%/%25/g' -e 's/$/%0A/' | tr -d '\n')"
            echo "::warning::$label:$chunk"
          }
          smoke linux-deb-x11 dbus-run-session -- xvfb-run -a bash \
            scripts/smoke-linux-runtime-identity.sh \
            x11 --kind binary "$binary" \
            target/release/bundle/identity-smoke-linux-deb-x11.json
          smoke linux-deb-wayland dbus-run-session -- bash \
            scripts/smoke-linux-runtime-identity.sh \
            wayland --kind binary "$binary" \
            target/release/bundle/identity-smoke-linux-deb-wayland.json
          smoke linux-appimage-x11 dbus-run-session -- xvfb-run -a bash \
            scripts/smoke-linux-runtime-identity.sh \
            x11 --kind appimage "$appimage" \
            target/release/bundle/identity-smoke-linux-appimage-x11.json
          smoke linux-appimage-wayland dbus-run-session -- bash \
            scripts/smoke-linux-runtime-identity.sh \
            wayland --kind appimage "$appimage" \
            target/release/bundle/identity-smoke-linux-appimage-wayland.json

      # The two shipped Windows files are built and uploaded here, once: the
      # portable zip from the release binaries and the renamed NSIS installer.
      # They used to travel as workflow artifacts into the `release` job, which
      # re-zipped and re-uploaded the same bytes from a second runner.
      #
      # Runner binary is embedded in the main executable via include_bytes!
      # CDP launcher sidecar must be included alongside the main exe for
      # the "Create CDP Launcher Shortcut" feature to work in portable mode.
      - name: Upload Windows assets to the draft release
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.version }}
          CDP_TARGET: ${{ matrix.cdp_target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $portableDir = 'build/windows-portable'
          $mainExe = 'target/release/auto-quest-complete-discord.exe'
          $bridgeExe = "src-tauri/binaries/waybridge-$env:CDP_TARGET.exe"
          $nsisDir = 'target/release/bundle/nsis'
          # A missing file here used to surface as a bare Copy-Item error several
          # minutes into the only Windows job of the release.
          foreach ($source in @($mainExe, $bridgeExe)) {
            if (-not (Test-Path $source)) {
              Write-Error "Expected build output '$source' is missing"
              exit 1
            }
          }
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item $mainExe "$portableDir/auto-quest-complete-discord.exe"
          Copy-Item $bridgeExe "$portableDir/waybridge.exe"

          $zip = "build/auto-quest-complete-discord-Windows-x64-$env:VERSION-portable.zip"
          Compress-Archive -Path "$portableDir/*" -DestinationPath $zip -Force

          # `--bundles nsis` above means the NSIS .exe is the only installer this
          # job produces, so a missing match means the bundler changed behaviour,
          # not a transient glitch: fail in the build job instead of shipping a
          # release without it.
          $nsis = @(Get-ChildItem -Path $nsisDir -Filter '*.exe' -File)
          if ($nsis.Count -eq 0) {
            Write-Error "No *.exe inside $nsisDir"
            exit 1
          }
          $installer = $nsis[0].FullName
          $setup = "build/auto-quest-complete-discord-Windows-x64-$env:VERSION-setup.exe"
          Copy-Item $installer $setup

          # Native commands never raise a PowerShell error, so the upload has to
          # report its own exit code or a rejected asset would pass as a success.
          gh release upload "$env:VERSION" "$zip" "$setup" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # TEMP Windows-only publishing: this step and the Linux one below mirror the
      # Windows upload for the two disabled matrix entries, so re-enabling a
      # platform adds a runner instead of re-adding release plumbing. macOS
      # bundling is the slowest job and the Linux one adds four headless GUI
      # smoke tests.
      - name: Upload macOS assets to the draft release
        if: matrix.platform == 'macos-14'
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.version }}
        run: |
          set -euo pipefail
          prefix="auto-quest-complete-discord-MacOS-arm64-$VERSION"
          mkdir -p build
          uploaded=0
          # Search all of target/: the bundler only honours --target when the
          # cargo config says so, and a hard-coded path would fail silently.
          dmg="$(find target -maxdepth 8 -type f -name '*.dmg' | head -n 1 || true)"
          if [ -n "$dmg" ]; then
            cp "$dmg" "build/$prefix.dmg"
            gh release upload "$VERSION" "build/$prefix.dmg" --clobber
            uploaded=1
          fi
          # `--keepParent` keeps the .app directory the user drags into
          # Applications; plain `zip -r` would flatten its Versions/ symlinks.
          app="$(find target -maxdepth 8 -type d -name '*.app' | head -n 1 || true)"
          if [ -n "$app" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$app" "build/$prefix.zip"
            gh release upload "$VERSION" "build/$prefix.zip" --clobber
            uploaded=1
          fi
          if [ "$uploaded" = 0 ]; then
            echo "::error::No macOS .dmg or .app produced by the bundle step"
            exit 1
          fi

      - name: Upload Linux assets to the draft release
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.version }}
        run: |
          set -euo pipefail
          prefix="auto-quest-complete-discord-Linux-x86_64-$VERSION"
          mkdir -p build
          appimage="$(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -type f | head -n 1 || true)"
          deb="$(find target/release/bundle/deb -maxdepth 1 -name '*.deb' -type f | head -n 1 || true)"
          if [ -z "$appimage" ] || [ -z "$deb" ]; then
            echo "::error::Missing .deb or .AppImage (deb='$deb' appimage='$appimage')"
            exit 1
          fi
          cp "$appimage" "build/$prefix.AppImage"
          cp "$deb" "build/$prefix.deb"
          gh release upload "$VERSION" "build/$prefix.AppImage" "build/$prefix.deb" --clobber

  # Both branches rejoin here. The finished assets are already attached to the
  # draft by the time this runs, so all that is left is to refuse to publish
  # unless `quality` and every platform build came back green, and then flip the
  # draft switch. No checkout, no artifact download, no repack: those were a
  # second runner doing nothing but moving the same bytes onto the release.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - release_policy
      - quality
      - build-tauri
    # `build-tauri` does not wait for `quality`, so this is where they meet.
    # `always()` is what lets a failed build explain itself here instead of
    # leaving a draft behind that nobody reports on.
    if: >-
      always() &&
      needs.release_policy.result == 'success' &&
      needs.release_policy.outputs.should_release == 'true'
    permissions:
      contents: write
    steps:
      - name: Publish the draft release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release_policy.outputs.version }}
          GATES: ${{ needs.quality.result }} ${{ needs.build-tauri.result }}
        run: |
          set -euo pipefail
          if [ "$GATES" != 'success success' ]; then
            echo "::error::Release gates were: $GATES"
            echo "::notice::Draft $VERSION is left unpublished; fix the failing job and re-run this workflow."
            exit 1
          fi

          # TEMP (Windows-only publishing): extend this list with the macOS and
          # Linux asset names when their matrix entries come back, so a bundler
          # that stops producing an asset cannot publish a half-release.
          assets="$(gh release view "$VERSION" --json assets --jq '.assets[].name')"
          for expected in \
            "auto-quest-complete-discord-Windows-x64-$VERSION-setup.exe" \
            "auto-quest-complete-discord-Windows-x64-$VERSION-portable.zip"; do
            if ! grep -qxF "$expected" <<< "$assets"; then
              echo "::error::Draft $VERSION is missing the asset $expected"
              printf '%s\n' "$assets"
              exit 1
            fi
          done

          gh release edit "$VERSION" --draft=false

  reset-develop:
    name: Reset develop after stable release
    needs:
      - release_policy
      - build-tauri
      - release
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.release_policy.outputs.should_release == 'true' &&
      needs.release_policy.outputs.prerelease == 'false' &&
      needs.build-tauri.result == 'success' &&
      needs.release.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: reset-develop
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_VERSION: ${{ needs.release_policy.outputs.version }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Backup and rebuild develop
        shell: bash
        run: |
          set -euo pipefail

          backup_tag="develop-before-${RELEASE_VERSION}"
          main_sha="${RELEASE_SHA}"
          backup_tag_needs_push=false
          develop_sha="$(git ls-remote --heads origin develop | awk 'NR == 1 { print $1 }')"

          # Annotated tags need an identity even when the job only updates refs.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -z "${develop_sha}" ]]; then
            # Nothing to back up and nothing to reset: a repository that has
            # never had a develop branch must not turn a finished release into
            # a red run.
            echo "::notice::The develop branch does not exist; skipping the reset."
            exit 0
          fi

          existing_backup_sha="$(git rev-parse --verify --quiet "refs/tags/${backup_tag}^{commit}" || true)"
          if [[ -n "${existing_backup_sha}" ]]; then
            if [[ "${develop_sha}" == "${main_sha}" ]]; then
              echo "::notice::develop already points to ${main_sha}; ${backup_tag} is already present."
              exit 0
            fi

            if [[ "${existing_backup_sha}" != "${develop_sha}" ]]; then
              echo "::error::Backup tag ${backup_tag} already points to ${existing_backup_sha}, but develop is now ${develop_sha}."
              echo "::error::Refusing to overwrite an existing backup or reset a changed develop branch."
              exit 1
            fi

            echo "Backup tag ${backup_tag} already points to the current develop commit."
          else
            git tag --annotate "${backup_tag}" "${develop_sha}" \
              --message "Backup develop before stable release ${RELEASE_VERSION}"
            backup_tag_needs_push=true
          fi

          if [[ "${develop_sha}" == "${main_sha}" ]]; then
            echo "develop already points to the stable release commit ${main_sha}; nothing to reset."
            exit 0
          fi

          # This is the safe equivalent of deleting and recreating develop:
          # update the branch ref in one operation while refusing to overwrite
          # a concurrent develop push. When the backup tag is new, --atomic
          # keeps the tag and branch update together.
          if [[ "${backup_tag_needs_push}" == "true" ]]; then
            git push --atomic origin \
              "--force-with-lease=refs/heads/develop:${develop_sha}" \
              "refs/tags/${backup_tag}" \
              "${main_sha}:refs/heads/develop"
            echo "Created backup tag ${backup_tag} at ${develop_sha}."
          else
            git push origin \
              "--force-with-lease=refs/heads/develop:${develop_sha}" \
              "${main_sha}:refs/heads/develop"
          fi
          echo "Rebuilt develop at stable release commit ${main_sha}."
