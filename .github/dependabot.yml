# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Workflow actions stay on readable version tags (see AGENTS.md); Dependabot
  # only ever proposes `@vN` style refs for the github-actions ecosystem.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    # Limit open PRs to reduce noise
    open-pull-requests-limit: 5
    groups:
      actions-update:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    # Limit open PRs to reduce noise
    open-pull-requests-limit: 5
    # Only track patch updates, grouped into a single PR
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
    groups:
      patch-only:
        update-types:
          - "patch"
    # Keep the dependency surface stable by ignoring minor and major version bumps
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
    groups:
      patch-only:
        update-types:
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  # Remaining workspace members. They share the root Cargo.lock, but Dependabot
  # only scans the directories listed here, so each crate needs its own entry.
  - package-ecosystem: "cargo"
    directory: "/crates/discord-cdp-launch-core"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
    groups:
      patch-only:
        update-types:
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  - package-ecosystem: "cargo"
    directory: "/src-cdp-launcher"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
    groups:
      patch-only:
        update-types:
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  - package-ecosystem: "cargo"
    directory: "/src-runner"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
    groups:
      patch-only:
        update-types:
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
