<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/app-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto Quest Complete Discord</title>
    <!-- Paint the stored theme before the bundle loads, otherwise every launch
         flashes the light palette until Setup mounts. -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('theme_mode')
          if (mode !== 'light' && mode !== 'dark' && mode !== 'system') {
            mode = localStorage.getItem('theme')
          }
          var followsSystem = mode !== 'light' && mode !== 'dark'
          var dark = mode === 'dark' ||
            (followsSystem && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.add(dark ? 'dark' : 'light')
        } catch (error) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
