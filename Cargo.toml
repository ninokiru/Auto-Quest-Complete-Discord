[workspace]
members = [
    "crates/discord-cdp-launch-core",
    "src-tauri",
    "src-cdp-launcher",
    "src-runner",
]
default-members = [
    "src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
# 16 rather than 1: the release runners expose 4 cores, and one codegen unit
# serialises LLVM across the whole crate graph, which was the bulk of the ~450s
# Windows bundle step. The sidecars below keep their single-unit profile.
codegen-units = 16
debug = 1
split-debuginfo = "packed"
strip = "symbols"

[profile.sidecar-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
